<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Confirmar exclusão</title>
</head>
<body>
    <h1>Confirmar exclusão</h1>
    <p>Tem certeza que deseja excluir o livro "<strong>{{ object.titulo }}</strong>"?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit">Sim, excluir</button>
    </form>
    
    <a href="{% url 'lista_livros' %}">Cancelar</a>
</body>
</html>
