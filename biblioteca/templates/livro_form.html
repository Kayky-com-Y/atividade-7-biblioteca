<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if form.instance.pk %}Editar livro{% else %}Novo livro{% endif %}</title>
</head>
<body>
    <h1>{% if form.instance.pk %}Editar livro{% else %}Novo livro{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        {% if form.instance.pk %}
            <button type="submit">Editar livro</button>
        {% else %}
            <button type="submit">Novo livro</button>
        {% endif %}
    </form>
</body>
</html>
