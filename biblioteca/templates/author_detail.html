<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Author detail</title>
</head>
<body>
    <li>
        <h1>Author: {{ author.nome }}</h1>
        <h2>Livros do autor:</h2>
        <ul>
            {% for livro in livros %}
                <li>{{ livro.titulo }} {{ livro.ano_publicacao }}</li>
            {% empty %}
                <li>Nenhum livro encontrado para este autor.</li>
            {% endfor %}
        </ul>
    </li>
</body>
</html>
