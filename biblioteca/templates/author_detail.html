<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Author detail</title>
</head>
<body>
    <button><a href="{% url 'lista_autores' %}">Lista de Autores</a></button>
    <button><a href="{% url 'lista_livros' %}">Lista de Livros</a></button>
    <li>
        <h1>Author: {{ author.name }} {{ author.nationality }}</h1>
        <h2>Livros do autor:</h2>
        <ul>
            {% for livro in livros %}
                <li>{{ livro.titulo }} {{ livro.ano_publicacao }}</li>
                <button><a href="{% url 'livro_detail' livro.id %}">Detalhes do Livro</a></button>
                <button><a href="{% url 'livro_update' livro.id %}">Editar Livro</a></button>
            {% empty %}
                <li>Nenhum livro encontrado para este autor.</li>
            {% endfor %}
        </ul>
    </li>
</body>
</html>
