<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livro</title>
</head>
<body>
    <button><a href="{% url 'lista_livros' %}">Lista de Livros</a></button>
    <button><a href="{% url 'lista_autores' %}">Lista de Autores</a></button>
    <button><a href="{% url 'sobre' %}">Sobre</a></button>
    <h1>{{ livro.titulo }}</h1>
    {% if livro.capa %}
        <img src="{{ livro.capa.url }}" alt="Capa de {{ livro.titulo }}">
    {% endif %}
    <p><strong>Autor:</strong> {{ livro.autor }}</p>
    <p><strong>Categoria:</strong> {{ livro.category }}</p>
    <p><strong>Ano de Publicação:</strong> {{ livro.ano_publicacao }}</p>
    <p><strong>Páginas:</strong> {{ livro.paginas|default:"Não informado" }}</p>
    <p><strong>ISBN:</strong> {{ livro.isbn|default:"Não informado" }}</p>
    <p><strong>Disponível:</strong> {{ livro.disponivel }}</p>
    <button><a href="{% url 'livro_update' livro.id %}">Editar Livro</a></button>
    <button><a href="{% url 'livro_delete' livro.id %}">Excluir Livro</a></button>
</body>
</html>
