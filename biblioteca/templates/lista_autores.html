<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Lista de Autores</h1>
    <button><a href="{% url 'author_create' %}">Criar Autor</a></button>
    <ul>
        {% for author in autores %}
            <li>
                <a href="{% url 'author_detail' author.id %}"><strong>Nome:</strong> {{ author.name }}</a><br>
                <p><strong>Nacionalidade:</strong> {{ author.nationality }}</p>
            </li>
            <hr>
        {% empty %}
            <li>Nenhum autor cadastrado.</li>
        {% endfor %}
</body>
</html>
